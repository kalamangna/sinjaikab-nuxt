name: Build & Push to Deploy Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & Push to Deploy Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Static Site
        run: npm run generate

      - name: Prepare Deployment Artifacts
        run: |
          cp -r .nuxt/dist/client/* .output/public/ || true
          cp -r public/* .output/public/ || true
          cp public/.htaccess .output/public/.htaccess || true
          cp .cpanel.yml .output/public/.cpanel.yml
          touch .output/public/.nojekyll

      - name: Deploy to Branch 'deploy'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: .output/public
          keep_files: false
